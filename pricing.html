<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Pricing | YZ STORE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://i.ibb.co/YT1RPZdx/image.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #070709; color: #f4f4f5; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(18,18,24,.7); border: 1px solid rgba(255,255,255,.08); }
        .card { background: linear-gradient(180deg, rgba(24,24,32,.8) 0%, rgba(12,12,16,.95) 100%); border: 1px solid rgba(255,255,255,.07); }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-5xl mx-auto px-6 py-16">
        <a href="index.html" class="inline-flex items-center gap-2 mb-10">
            <img src="https://i.ibb.co/YT1RPZdx/image.png" class="h-9 w-auto">
            <span class="font-black text-lg">YZ STORE</span>
        </a>

        <h1 class="text-3xl font-black mb-2">Pricing</h1>
        <p class="text-gray-400 text-sm mb-10">All prices are in USD. Products are digital and delivered instantly after payment, processed securely by Paddle.com.</p>

        <div id="pricing-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-gray-500 col-span-full">Loading products...</p>
        </div>

        <div class="mt-14 flex flex-wrap gap-4 text-xs text-gray-500">
            <a href="terms.html" class="hover:text-white">Terms of Service</a>
            <a href="privacy.html" class="hover:text-white">Privacy Policy</a>
            <a href="refund.html" class="hover:text-white">Refund Policy</a>
            <a href="index.html" class="hover:text-white">Back to Store</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCt5H1t5dqUxileT88DqkIT5WRSGx45Lps",
            authDomain: "osman-70f42.firebaseapp.com",
            databaseURL: "https://osman-70f42-default-rtdb.firebaseio.com",
            projectId: "osman-70f42",
            storageBucket: "osman-70f42.firebasestorage.app"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const escapeHtml = (str) => {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        };
        const safeUrl = (url) => {
            try { const u = new URL(url, window.location.href); if (u.protocol === 'http:' || u.protocol === 'https:') return u.href; } catch (e) {}
            return '#';
        };

        onValue(ref(db, "products"), s => {
            const grid = document.getElementById('pricing-grid');
            const items = [];
            s.forEach(p => items.push(p.val()));

            if (items.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full">No products available right now.</p>`;
                return;
            }

            grid.innerHTML = items.map(p => `
                <div class="card rounded-2xl overflow-hidden">
                    <img src="${safeUrl(p.image)}" class="w-full h-40 object-cover">
                    <div class="p-5">
                        <h3 class="font-bold text-white text-sm mb-1">${escapeHtml(p.title)}</h3>
                        <p class="text-[11px] text-gray-500 mb-3">${p.category === 'alerts' ? 'Alerts & Overlays' : p.category === 'packages' ? 'Packages & Subscriptions' : 'Digital Product'}</p>
                        <p class="text-red-500 font-black text-xl">$${escapeHtml(p.price)}</p>
                    </div>
                </div>`).join('');
        }, () => {
            document.getElementById('pricing-grid').innerHTML = `<p class="text-gray-500 col-span-full">Could not load pricing right now. Please refresh.</p>`;
        });
    </script>
</body>
</html>
