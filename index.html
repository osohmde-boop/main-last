    <!-- Firebase & Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove, update, set } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCt5H1t5dqUxileT88DqkIT5WRSGx45Lps",
            authDomain: "osman-70f42.firebaseapp.com",
            databaseURL: "https://osman-70f42-default-rtdb.firebaseio.com",
            projectId: "osman-70f42",
            storageBucket: "osman-70f42.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        
        const ADMIN_EMAIL = "osohmde@gmail.com";
        const Toast = Swal.mixin({ toast: true, position: 'top-start', showConfirmButton: false, timer: 2000, background: '#18181b', color: '#fff' });
        
        let cart = [], allProducts = [], currentCat = 'all';

        // Load Store Description
        onValue(ref(db, "store_settings/desc"), s => {
            document.getElementById('store-desc-display').innerText = s.val() || "مرحباً بك في YZ STORE، المتجر الأفضل لتطوير تجربة البث المباشر وتجهيز الحسابات الرقمية.";
        });

        window.editStoreDesc = async () => {
            const cur = document.getElementById('store-desc-display').innerText;
            const { value: text } = await Swal.fire({
                title: 'تعديل وصف المتجر', input: 'textarea', inputValue: cur,
                confirmButtonColor: '#dc2626', showCancelButton: true, cancelButtonText: 'إلغاء', confirmButtonText: 'حفظ'
            });
            if(text) {
                set(ref(db, "store_settings/desc"), text).then(() => {
                    Toast.fire({ icon: 'success', title: 'تم حفظ الوصف الجديد' });
                });
            }
        };

        const PAYMENT_DATA = {
            paddle: { 
                title: 'الدفع الإلكتروني (Apple Pay / بطاقة بنكية / فيزا)', 
                icon: 'https://cdn-icons-png.flaticon.com/512/888/888870.png',
                isPaddle: true
            },
            paypal: { title: 'PayPal', icon: 'https://cdn-icons-png.flaticon.com/512/174/174861.png', value: 'yazen.makki@gmail.com', link: 'https://paypal.me/yzstore0' },
            binance: { title: 'Binance Pay (USDT)', icon: 'https://cryptologos.cc/logos/binance-coin-bnb-logo.png', value: '86551336', name: 'YZ STORE' },
            bank: { title: 'التحويل البنكي (تركيا والسعودية)', icon: 'https://cdn-icons-png.flaticon.com/512/2830/2830284.png', value: 'SA9230000000123456784849', name: 'يزن عادل حسن' }
        };

        onAuthStateChanged(auth, user => {
            const isAdmin = user && user.email === ADMIN_EMAIL;
            document.getElementById('admin-panel').classList.toggle('hidden', !isAdmin);
            document.getElementById('user-orders-section').classList.toggle('hidden', !user);
            document.getElementById('auth-btn').innerText = user ? "حسابي (خروج)" : "تسجيل الدخول";
            if(isAdmin) loadAdminOrders();
            if(user) loadUserOrders(user.email);
            onValue(ref(db, "products"), s => { allProducts = []; s.forEach(p => { allProducts.push({...p.val(), key: p.key}); }); renderProducts(); });
        });

        window.loginWithGoogle = () => {
            signInWithPopup(auth, googleProvider)
                .then(() => {
                    Swal.close();
                    Toast.fire({ icon: 'success', title: 'تم تسجيل الدخول عبر Google' });
                })
                .catch(err => Swal.fire('خطأ', err.message, 'error'));
        };

        window.handleAuth = () => {
            if(auth.currentUser) {
                signOut(auth).then(() => {
                    Toast.fire({ icon: 'success', title: 'تم تسجيل الخروج بنجاح' });
                    setTimeout(() => location.reload(), 1000);
                });
            } else {
                Swal.fire({
                    title: 'تسجيل الدخول إلى حسابك',
                    html: `
                        <input id="e" class="swal2-input" placeholder="البريد الإلكتروني">
                        <input id="p" type="password" class="swal2-input" placeholder="كلمة المرور">
                        <button onclick="window.loginWithGoogle()" class="w-full mt-4 p-3 bg-white text-black rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-gray-200 transition text-sm">
                            <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" class="w-4"> الدخول السريع بواسطة Google
                        </button>
                        <div class="mt-4 flex justify-between text-xs text-gray-400">
                            <button onclick="window.forgotPass()" class="hover:text-red-400">نسيت كلمة المرور؟</button>
                            <button onclick="window.openRegister()" class="text-blue-400 font-bold">إنشاء حساب جديد</button>
                        </div>`,
                    confirmButtonText: 'دخول',
                    confirmButtonColor: '#dc2626',
                    showCancelButton: true,
                    cancelButtonText: 'إلغاء'
                }).then(r => { 
                    if(r.isConfirmed) {
                        const email = document.getElementById('e').value;
                        const pass = document.getElementById('p').value;
                        if(!email || !pass) return Toast.fire({ icon: 'error', title: 'يرجى ملء الحقول' });
                        signInWithEmailAndPassword(auth, email, pass)
                            .then(() => Toast.fire({ icon: 'success', title: 'أهلاً بك مجدداً!' }))
                            .catch(() => Swal.fire('خطأ', 'بيانات الدخول غير صحيحة', 'error'));
                    }
                });
            }
        };

        window.openRegister = async () => {
            const { value: f } = await Swal.fire({
                title: 'إنشاء حساب جديد',
                html: `<input id="re" class="swal2-input" placeholder="البريد الإلكتروني"><input id="rp" type="password" class="swal2-input" placeholder="كلمة المرور">`,
                confirmButtonText: 'تسجيل',
                confirmButtonColor: '#dc2626',
                preConfirm: () => ({ e: document.getElementById('re').value, p: document.getElementById('rp').value })
            });
            if(f) {
                if(!f.e || !f.p) return Toast.fire({ icon: 'error', title: 'يرجى ملء البيانات' });
                createUserWithEmailAndPassword(auth, f.e, f.p)
                    .then(() => Toast.fire({ icon: 'success', title: 'تم إنشاء الحساب بنجاح' }))
                    .catch(e => Swal.fire('خطأ', e.message, 'error'));
            }
        };

        window.forgotPass = async () => {
            const { value: e } = await Swal.fire({ title: 'استعادة كلمة المرور', input: 'email', placeholder: 'بريدك الإلكتروني', confirmButtonColor: '#dc2626' });
            if(e) {
                sendPasswordResetEmail(auth, e)
                    .then(() => Swal.fire('تم الإرسال', 'تفقد بريدك الإلكتروني لتعيين كلمة مرور جديدة', 'success'))
                    .catch(() => Toast.fire({ icon: 'error', title: 'البريد غير مسجل' }));
            }
        };

        window.getYouTubeID = (url) => { if(!url) return null; const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/); return (match && match[2].length === 11) ? match[2] : null; };

        window.openAddProduct = async () => {
            const { value: f } = await Swal.fire({
                title: 'إضافة منتج جديد',
                html: `
                    <input id="nt" class="swal2-input" placeholder="اسم المنتج">
                    <input id="np" type="number" class="swal2-input" placeholder="السعر بالدولار ($)">
                    <input id="npid" class="swal2-input" placeholder="Paddle Price ID" value="pri_01m0d1b6ktsc65fcmnghdxsmcf">
                    <select id="nc" class="swal2-select"><option value="alerts">أليرتات</option><option value="packages">بكجات</option></select>
                    <input id="ny" class="swal2-input" placeholder="رابط يوتيوب للمعاينة (اختياري)">
                    <input id="ni" type="file" class="swal2-file">
                `,
                confirmButtonColor: '#dc2626',
                preConfirm: async () => {
                    const file = document.getElementById('ni').files[0];
                    if(!file) return Swal.showValidationMessage('يرجى اختيار صورة للمنتج');
                    const fd = new FormData(); fd.append("image", file);
                    try {
                        const res = await fetch('https://api.imgbb.com/1/upload?key=11517ad350ecf73397b84302f750238e', { method: 'POST', body: fd }).then(r => r.json());
                        return { 
                            title: document.getElementById('nt').value, 
                            price: document.getElementById('np').value, 
                            paddlePriceId: document.getElementById('npid').value || 'pri_01m0d1b6ktsc65fcmnghdxsmcf',
                            category: document.getElementById('nc').value, 
                            youtube: document.getElementById('ny').value, 
                            image: res.data.url 
                        };
                    } catch(e) { Swal.showValidationMessage('فشل رفع الصورة'); }
                }
            });
            if(f) {
                push(ref(db, "products"), f).then(() => Toast.fire({ icon: 'success', title: 'تمت إضافة المنتج بنجاح' }));
            }
        };

        const loadAdminOrders = () => {
            onValue(ref(db, "orders"), s => {
                const list = document.getElementById('orders-list'); list.innerHTML = "";
                let count = 0;
                s.forEach(o => {
                    const d = o.val();
                    if(d.status === 'pending') {
                        count++;
                        list.innerHTML += `<div class="p-3 bg-white/5 rounded-lg border border-white/5 flex justify-between items-center">
                            <div class="truncate max-w-[150px]"><p class="font-bold">${d.email}</p><p class="text-red-400 font-bold">${d.total}</p></div>
                            <div class="flex gap-1.5"><button onclick="window.activateOrder('${o.key}')" class="bg-green-600 px-2.5 py-1 rounded text-[11px] font-bold">تفعيل</button><button onclick="window.removeOrder('${o.key}')" class="bg-red-600 px-2.5 py-1 rounded text-[11px]">حذف</button></div>
                        </div>`;
                    }
                });
                document.getElementById('pending-count').innerText = count;
            });
        };

        window.activateOrder = async (key) => {
            const { value: url } = await Swal.fire({ 
                title: 'رابط التسليم / التحميل', 
                input: 'url', 
                placeholder: 'ضع رابط الملف (Google Drive / Mega) أو كود التفعيل',
                showCancelButton: true, cancelButtonText: 'إلغاء', confirmButtonText: 'تفعيل الطلب', confirmButtonColor: '#16a34a'
            });

            if(url) {
                update(ref(db, `orders/${key}`), { status: 'active', productLink: url })
                    .then(() => Toast.fire({ icon: 'success', title: 'تم تفعيل الطلب وإتاحته للعميل 🚀' }));
            }
        };

        window.removeOrder = (k) => { 
            Swal.fire({
                title: 'هل تريد حذف هذا الطلب؟',
                icon: 'warning', showCancelButton: true, confirmButtonText: 'نعم، احذف', cancelButtonText: 'إلغاء', confirmButtonColor: '#dc2626'
            }).then(r => {
                if (r.isConfirmed) remove(ref(db, "orders/" + k)).then(() => Toast.fire({ icon: 'success', title: 'تم الحذف' }));
            });
        };

        const loadUserOrders = (email) => {
            onValue(ref(db, "orders"), s => {
                const list = document.getElementById('user-orders-list'); list.innerHTML = "";
                s.forEach(o => {
                    const d = o.val();
                    if(d.email === email) {
                        const active = d.status === 'active';
                        list.innerHTML += `<div class="glass-panel p-4 rounded-xl flex justify-between items-center ${active ? 'border-green-500/40' : 'border-yellow-500/40'}">
                            <div><p class="text-xs text-gray-400">طلب #${o.key.substr(-4)}</p><p class="font-black text-white text-sm">${d.total}</p></div>
                            ${active ? `<a href="${d.productLink}" target="_blank" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"><i class="fa fa-download"></i> تحميل المنتج</a>` : '<span class="text-yellow-400 text-xs font-bold bg-yellow-500/10 px-3 py-1 rounded-full">⏳ قيد المراجعة</span>'}
                        </div>`;
                    }
                });
            });
        };

        window.openVideoModal = (k) => {
            const p = allProducts.find(x => x.key === k);
            const yid = window.getYouTubeID(p.youtube);
            Swal.fire({
                width: window.innerWidth > 768 ? '750px' : '95%',
                padding: '20px',
                showConfirmButton: false,
                html: `
                    <div class="text-right">
                        <div class="relative pb-[56.25%] h-0 overflow-hidden rounded-xl mb-4 bg-black">
                            ${yid ? `<iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/${yid}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>` : `<img src="${p.image}" class="w-full h-full object-cover">`}
                        </div>
                        <h2 class="text-xl font-black text-white mb-2">${p.title}</h2>
                        <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl">
                            <span class="text-2xl font-black text-red-500">$${p.price}</span>
                            <button onclick="addToCart('${p.key}'); Swal.close()" class="bg-red-600 hover:bg-red-500 text-white px-6 py-2.5 rounded-xl font-bold text-xs shadow-lg transition">إضافة إلى السلة</button>
                        </div>
                    </div>
                `
            });
        };

        window.renderProducts = () => {
            const grid = document.getElementById('products-grid'); grid.innerHTML = "";
            const filtered = currentCat === 'all' ? allProducts : allProducts.filter(p => p.category === currentCat);
            
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-gray-500 font-bold">لا توجد منتجات في هذا القسم حالياً.</div>`;
                return;
            }

            filtered.forEach(p => {
                const isAdmin = auth.currentUser && auth.currentUser.email === ADMIN_EMAIL;
                grid.innerHTML += `
                <div class="product-card group flex flex-col justify-between overflow-hidden relative">
                    <div class="relative h-48 overflow-hidden cursor-pointer" onclick="openVideoModal('${p.key}')">
                        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        ${p.youtube ? `<span class="absolute bottom-3 right-3 bg-black/70 backdrop-blur-md text-white text-[11px] px-3 py-1 rounded-full font-bold flex items-center gap-1.5 border border-white/10"><i class="fa fa-play text-red-500"></i> معاينة</span>` : ''}
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <h3 class="font-bold text-white text-base mb-3 leading-snug">${p.title}</h3>
                        <div class="flex justify-between items-center pt-3 border-t border-white/5">
                            <span class="text-xl font-black text-red-500">$${p.price}</span>
                            <button onclick="addToCart('${p.key}')" class="bg-white hover:bg-red-600 hover:text-white text-black px-5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                                <i class="fa fa-cart-plus"></i> إضافة
                            </button>
                        </div>
                    </div>
                    ${isAdmin ? `
                    <div class="absolute top-3 left-3 flex gap-1.5 opacity-0 group-hover:opacity-100 transition">
                        <button onclick="window.editProduct('${p.key}')" class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg"><i class="fa fa-pen text-xs"></i></button>
                        <button onclick="window.deleteProduct('${p.key}')" class="bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg"><i class="fa fa-trash text-xs"></i></button>
                    </div>` : ''}
                </div>`;
            });
        };

        window.editProduct = async (k) => {
            const p = allProducts.find(x => x.key === k);
            const { value: f } = await Swal.fire({
                title: 'تعديل المنتج',
                html: `
                    <input id="ut" class="swal2-input" value="${p.title}" placeholder="الاسم">
                    <input id="up" class="swal2-input" value="${p.price}" placeholder="السعر">
                    <input id="upid" class="swal2-input" value="${p.paddlePriceId || 'pri_01m0d1b6ktsc65fcmnghdxsmcf'}" placeholder="Paddle Price ID">
                    <input id="uy" class="swal2-input" value="${p.youtube || ''}" placeholder="رابط يوتيوب">
                `,
                confirmButtonColor: '#dc2626',
                preConfirm: () => ({ 
                    title: document.getElementById('ut').value, 
                    price: document.getElementById('up').value, 
                    paddlePriceId: document.getElementById('upid').value,
                    youtube: document.getElementById('uy').value 
                })
            });
            if(f) update(ref(db, "products/"+k), f).then(() => Toast.fire({ icon: 'success', title: 'تم تحديث المنتج' }));
        };

        window.deleteProduct = (k) => { 
            if(confirm('حذف المنتج نهائياً؟')) remove(ref(db, "products/"+k)).then(() => Toast.fire({ icon: 'success', title: 'تم الحذف' })); 
        };

        window.addToCart = (k) => { 
            const it = allProducts.find(x => x.key === k); 
            const ex = cart.find(x => x.key === k);
            if(ex) ex.qty++; else cart.push({...it, qty: 1});
            updateCartUI(); 
            Toast.fire({ icon: 'success', title: 'تمت الإضافة للسلة' });
        };

        const updateCartUI = () => {
            let sub = 0;
            document.getElementById('cart-items').innerHTML = cart.map((it, i) => { 
                sub += it.price * it.qty; 
                return `
                <div class="flex justify-between items-center p-3.5 bg-white/5 rounded-xl border border-white/5">
                    <div class="max-w-[170px]"><p class="text-xs font-bold text-white truncate">${it.title}</p><p class="text-red-400 font-black text-sm">$${it.price}</p></div>
                    <div class="flex items-center gap-2.5 bg-black/50 px-2.5 py-1 rounded-lg border border-white/5">
                        <button onclick="updateQty(${i},-1)" class="text-gray-400 hover:text-red-500 font-bold px-1">-</button>
                        <span class="text-xs font-bold">${it.qty}</span>
                        <button onclick="updateQty(${i},1)" class="text-gray-400 hover:text-green-500 font-bold px-1">+</button>
                    </div>
                </div>`; 
            }).join('');
            document.getElementById('total-price').innerText = `$${sub.toFixed(2)}`;
            document.getElementById('cart-count').innerText = cart.reduce((a,b)=>a+b.qty,0);
        };

        window.updateQty = (i,d) => { cart[i].qty+=d; if(cart[i].qty<1) cart.splice(i,1); updateCartUI(); };
        window.toggleCart = (s) => document.getElementById('cart-drawer').classList.toggle('open', s);
        
        window.filterCat = (c) => { 
            currentCat = c; 
            document.querySelectorAll('.category-pill').forEach(i=>i.classList.remove('active')); 
            document.getElementById('cat-'+c).classList.add('active'); 
            renderProducts(); 
        };

        window.startCheckout = () => {
            if(!auth.currentUser) {
                toggleCart(false);
                return handleAuth();
            }
            if(cart.length === 0) return Toast.fire({ icon: 'info', title: 'سلة المشتريات فارغة' });
            Swal.fire({
                title: 'اختر طريقة الدفع', showConfirmButton: false,
                html: `
                    <div class="grid gap-2.5 mt-4">
                        ${Object.entries(PAYMENT_DATA).map(([k,v])=>`
                            <button onclick="showPayDetails('${k}')" class="p-3.5 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-between w-full transition border ${k==='paddle' ? 'border-red-500/40 bg-red-500/5' : 'border-white/5'}">
                                <div class="flex items-center gap-3">
                                    <img src="${v.icon}" class="w-6 h-6 object-contain"> 
                                    <span class="font-bold text-xs text-right text-white">${v.title}</span>
                                </div>
                                <i class="fa fa-chevron-left text-gray-500 text-xs"></i>
                            </button>
                        `).join('')}
                    </div>
                `
            });
        };

        window.openPaddleCheckout = (itemsList) => {
            const paddleItems = itemsList.map(item => ({
                priceId: item.paddlePriceId || 'pri_01m0d1b6ktsc65fcmnghdxsmcf',
                quantity: item.qty || 1
            }));

            Paddle.Checkout.open({
                items: paddleItems,
                customer: {
                    email: auth.currentUser ? auth.currentUser.email : ""
                },
                settings: {
                    displayMode: "overlay",
                    theme: "dark",
                    locale: "ar"
                }
            });
        };

        window.showPayDetails = (k) => {
            const d = PAYMENT_DATA[k];
            const total = document.getElementById('total-price').innerText;

            if (d.isPaddle) {
                Swal.close();
                toggleCart(false);
                window.openPaddleCheckout(cart);
                return;
            }

            const paypalBtn = k === 'paypal' ? `<a href="${d.link}" target="_blank" class="block w-full bg-blue-600 text-white p-3.5 rounded-xl mb-3 font-bold text-center text-xs shadow-lg">الدفع المباشر عبر PayPal</a>` : '';
            Swal.fire({ 
                title: d.title, 
                confirmButtonText: 'تأكيد التحويل وإرسال الطلب', 
                confirmButtonColor: '#dc2626',
                showCancelButton: true, cancelButtonText: 'إلغاء',
                html: `
                    ${paypalBtn}
                    <div class="p-3.5 bg-white/5 border border-dashed border-white/20 rounded-xl font-mono text-xs break-all mb-2 select-all">${d.value}</div>
                    ${d.name ? `<div class="text-xs text-gray-400 mb-3">باسم: ${d.name}</div>` : ''}
                    <p class="text-xs text-gray-400">بعد إتمام التحويل، اضغط على زر التأكيد وسيتم مراجعة الدفع وتفعيل الملفات فوراً في حسابك.</p>` 
            })
            .then(r => { 
                if(r.isConfirmed) {
                    push(ref(db, "orders"), { 
                        email: auth.currentUser.email, 
                        total: total, 
                        method: k, 
                        status: 'pending', 
                        items: cart, 
                        timestamp: Date.now()
                    }).then(() => {
                        window.open(`https://wa.me/905377964233?text=طلب جديد بقيمة ${total} عبر ${k} من: ${auth.currentUser.email}`, '_blank');
                        cart = []; 
                        updateCartUI(); 
                        toggleCart(false);
                        Swal.fire('تم استلام طلبك', 'سيتم التحقق وتجهيز ملفاتك خلال لحظات', 'success');
                    });
                }
            });
        };

        // Paddle Legal Policies Modal
        window.showLegalModal = (type) => {
            const data = {
                terms: {
                    title: 'Terms of Service | شروط الخدمة',
                    content: `
                        <div class="text-left text-xs space-y-3 leading-relaxed text-gray-300 font-sans" dir="ltr">
                            <p><strong>1. Services:</strong> YZ STORE provides digital streaming assets, sound alerts, overlays, and graphics.</p>
                            <p><strong>2. Delivery:</strong> All goods are delivered electronically via instant download on your dashboard upon payment.</p>
                            <p><strong>3. Merchant of Record:</strong> Paddle.com is the Merchant of Record for all orders and handles customer inquiries.</p>
                        </div>
                    `
                },
                refund: {
                    title: 'Refund Policy | سياسة الاسترجاع',
                    content: `
                        <div class="text-left text-xs space-y-3 leading-relaxed text-gray-300 font-sans" dir="ltr">
                            <p>Because digital files are accessible immediately upon purchase, sales are generally final once downloaded.</p>
                            <p><strong>14-Day Guarantee:</strong> Refunds are granted within 14 days if the product is defective or undelivered.</p>
                            <p>Contact support at <a href="mailto:osohmde@gmail.com" class="text-red-400 underline">osohmde@gmail.com</a>.</p>
                        </div>
                    `
                },
                privacy: {
                    title: 'Privacy Policy | سياسة الخصوصية',
                    content: `
                        <div class="text-left text-xs space-y-3 leading-relaxed text-gray-300 font-sans" dir="ltr">
                            <p>We respect your privacy and only collect essential information required for order fulfillment and support. Payments are processed securely via Paddle.com.</p>
                        </div>
                    `
                },
                contact: {
                    title: 'Contact Us | اتصل بنا',
                    content: `
                        <div class="text-left text-xs space-y-2 leading-relaxed text-gray-300 font-sans" dir="ltr">
                            <p><strong>Business Name:</strong> YZ STORE (Muhammed Osman)</p>
                            <p><strong>Email:</strong> <a href="mailto:osohmde@gmail.com" class="text-red-400 underline">osohmde@gmail.com</a></p>
                            <p><strong>WhatsApp:</strong> +90 537 796 42 33</p>
                            <p><strong>Address:</strong> Mimar Sinan Mah. 8504 Sk. No:13, Osmaniye, Turkey</p>
                        </div>
                    `
                }
            };

            Swal.fire({
                title: data[type].title,
                html: data[type].content,
                confirmButtonText: 'إغلاق',
                confirmButtonColor: '#dc2626'
            });
        };
    </script>
</body>
</html>
