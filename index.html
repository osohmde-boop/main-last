                            price: document.getElementById('np').value, 
                            paddlePriceId: document.getElementById('npid').value || 'pri_01m0d1b6ktsc65fcmnghdxsmcf',
                            category: document.getElementById('nc').value, 
                            tier: document.getElementById('ntr').value, 
                            youtube: document.getElementById('ny').value, 
                            image: res.data.url 
                        };
                    } catch(e) { Swal.showValidationMessage('فشل رفع الصورة'); }
                }
            });
            if(f) {
                push(ref(db, "products"), f).then(() => Toast.fire({ icon: 'success', title: 'تمت إضافة المنتج' }));
            }
        };

        const loadAdminOrders = () => {
            onValue(ref(db, "orders"), s => {
                const list = document.getElementById('orders-list'); list.innerHTML = "";
                s.forEach(o => {
                    const d = o.val();
                    if(d.status === 'pending') {
                        list.innerHTML += `<div class="p-4 bg-white/5 rounded-xl border border-white/5 mb-2">
                            <p class="font-bold text-xs truncate">${d.email}</p><p class="text-red-500 font-black">${d.total}</p>
                            <div class="flex gap-2 mt-2"><button onclick="window.activateOrder('${o.key}')" class="bg-green-600 px-3 py-1 rounded text-xs">تفعيل</button><button onclick="window.removeOrder('${o.key}')" class="bg-red-600 px-3 py-1 rounded text-xs">حذف</button></div>
                        </div>`;
                    }
                });
            });
        };

        window.activateOrder = async (key) => {
            const { value: url } = await Swal.fire({ title: 'رابط التحميل', input: 'url', background: '#121212', color: '#fff', placeholder: 'ضع رابط الملف هنا' });
            if(url) {
                update(ref(db, `orders/${key}`), { status: 'active', productLink: url })
                    .then(() => Toast.fire({ icon: 'success', title: 'تم تفعيل الطلب' }));
            }
        };
        window.removeOrder = (k) => { if(confirm('هل أنت متأكد من حذف الطلب؟')) remove(ref(db, "orders/"+k)); };

        const loadUserOrders = (email) => {
            onValue(ref(db, "orders"), s => {
                const list = document.getElementById('user-orders-list'); list.innerHTML = "";
                s.forEach(o => {
                    const d = o.val();
                    if(d.email === email) {
                        const active = d.status === 'active';
                        list.innerHTML += `<div class="glass p-4 mb-2 flex justify-between items-center ${active ? 'border-green-500/50' : 'border-yellow-500/50'}">
                            <div><p class="text-xs text-gray-400">طلب #${o.key.substr(-4)}</p><p class="font-bold text-red-500">${d.total}</p></div>
                            ${active ? `<a href="${d.productLink}" target="_blank" class="bg-green-600 px-4 py-2 rounded-full text-xs font-bold">تحميل المنتج</a>` : '<span class="text-yellow-500 text-xs font-bold">⏳ قيد المراجعة</span>'}
                        </div>`;
                    }
                });
            });
        };

        window.openVideoModal = (k) => {
            const p = allProducts.find(x => x.key === k);
            const yid = window.getYouTubeID(p.youtube);
            Swal.fire({
                background: '#0f0f10',
                color: '#fff',
                width: window.innerWidth > 768 ? '800px' : '95%',
                padding: window.innerWidth > 768 ? '30px' : '15px',
                showConfirmButton: false,
                html: `
                    <div class="text-right">
                        <div class="video-wrapper mb-6">
                            ${yid ? `<iframe src="https://www.youtube.com/embed/${yid}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>` : `<img src="${p.image}" class="w-full rounded-xl">`}
                        </div>
                        <h2 class="text-2xl font-black mb-4">${p.title}</h2>
                        <div class="flex justify-between items-center bg-white/5 p-4 rounded-xl">
                            <span class="text-3xl font-black text-red-500">$${p.price}</span>
                            <button onclick="addToCart('${p.key}'); Swal.close()" class="bg-red-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-red-600/20 hover:bg-red-700 transition">إضافة للسلة</button>
                        </div>
                    </div>
                `
            });
        };

        window.renderProducts = () => {
            const grid = document.getElementById('products-grid'); grid.innerHTML = "";
            const filtered = currentCat === 'all' ? allProducts : allProducts.filter(p => p.category === currentCat);
            filtered.forEach(p => {
                const isAdmin = auth.currentUser && auth.currentUser.email === ADMIN_EMAIL;
                const tierClass = p.tier === 'luxury' ? 'card-luxury' : (p.tier === 'premium' ? 'card-premium' : 'card-basic');
                grid.innerHTML += `<div class="glass ${tierClass} group relative overflow-hidden flex flex-col h-full transition hover:-translate-y-1">
                    <div class="p-4 flex-1 cursor-pointer" onclick="openVideoModal('${p.key}')">
                        <div class="media-container mb-4"><img src="${p.image}"></div>
                        <h3 class="font-bold">${p.title}</h3>
                    </div>
                    <div class="p-4 border-t border-white/5 flex justify-between items-center bg-black/20">
                        <span class="font-black text-red-500">$${p.price}</span>
                        <button onclick="addToCart('${p.key}')" class="bg-white text-black px-4 py-1 rounded-lg font-bold hover:bg-red-600 hover:text-white transition">إضافة</button>
                    </div>
                    ${isAdmin ? `<div class="absolute top-2 left-2 flex gap-1 opacity-0 group-hover:opacity-100 transition"><button onclick="window.editProduct('${p.key}')" class="bg-blue-600 w-7 h-7 rounded-full"><i class="fa fa-pen text-[10px]"></i></button><button onclick="window.deleteProduct('${p.key}')" class="bg-red-600 w-7 h-7 rounded-full"><i class="fa fa-trash text-[10px]"></i></button></div>` : ''}
                </div>`;
            });
        };

        window.editProduct = async (k) => {
            const p = allProducts.find(x => x.key === k);
            const { value: f } = await Swal.fire({
                title: 'تعديل المنتج', background: '#121212', color: '#fff',
                html: `
                    <input id="ut" class="swal2-input" value="${p.title}" placeholder="الاسم">
                    <input id="up" class="swal2-input" value="${p.price}" placeholder="السعر">
                    <input id="upid" class="swal2-input" value="${p.paddlePriceId || 'pri_01m0d1b6ktsc65fcmnghdxsmcf'}" placeholder="Paddle Price ID">
                    <input id="uy" class="swal2-input" value="${p.youtube || ''}" placeholder="رابط يوتيوب">
                `,
                preConfirm: () => ({ 
                    title: document.getElementById('ut').value, 
                    price: document.getElementById('up').value, 
                    paddlePriceId: document.getElementById('upid').value,
                    youtube: document.getElementById('uy').value 
                })
            });
            if(f) update(ref(db, "products/"+k), f).then(() => Toast.fire({ icon: 'success', title: 'تم التحديث' }));
        };
        window.deleteProduct = (k) => { if(confirm('حذف المنتج نهائياً؟')) remove(ref(db, "products/"+k)).then(() => Toast.fire({ icon: 'success', title: 'تم الحذف' })); };

        window.addToCart = (k) => { 
            const it = allProducts.find(x => x.key === k); 
            const ex = cart.find(x => x.key === k);
            if(ex) ex.qty++; else cart.push({...it, qty: 1});
            updateCartUI(); Toast.fire({ icon: 'success', title: 'تمت الإضافة للسلة' });
        };

        const updateCartUI = () => {
            let sub = 0;
            document.getElementById('cart-items').innerHTML = cart.map((it, i) => { 
                sub += it.price * it.qty; 
                return `<div class="flex justify-between items-center p-3 bg-white/5 rounded-xl mb-2">
                    <div><p class="text-sm font-bold">${it.title}</p><p class="text-red-500 font-black">$${it.price}</p></div>
                    <div class="flex items-center gap-3 bg-black/40 px-3 py-1 rounded-lg">
                        <button onclick="updateQty(${i},-1)" class="text-red-500 font-bold">-</button>
                        <span class="text-xs">${it.qty}</span>
                        <button onclick="updateQty(${i},1)" class="text-green-500 font-bold">+</button>
                    </div>
                </div>`; 
            }).join('');
            document.getElementById('total-price').innerText = `$${sub.toFixed(2)}`;
            document.getElementById('cart-count').innerText = cart.reduce((a,b)=>a+b.qty,0);
        };

        window.updateQty = (i,d) => { cart[i].qty+=d; if(cart[i].qty<1) cart.splice(i,1); updateCartUI(); };
        window.toggleCart = (s) => document.getElementById('cart-drawer').classList.toggle('open', s);
        window.filterCat = (c) => { currentCat = c; document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active')); document.getElementById('cat-'+c).classList.add('active'); renderProducts(); };

        window.startCheckout = () => {
            if(!auth.currentUser) {
                toggleCart(false);
                return handleAuth();
            }
            if(cart.length === 0) return Toast.fire({ icon: 'info', title: 'السلة فارغة' });
            Swal.fire({
                title: 'اختر طريقة الدفع', background:'#121212', color:'#fff', showConfirmButton: false,
                html: `
                    <div class="grid gap-3">
                        ${Object.entries(PAYMENT_DATA).map(([k,v])=>`
                            <button onclick="showPayDetails('${k}')" class="p-4 glass flex items-center justify-between w-full hover:bg-white/5 transition border ${k==='paddle' ? 'border-red-500/40 bg-red-500/5' : 'border-white/5'}">
                                <div class="flex items-center gap-3">
                                    <img src="${v.icon}" class="w-8 h-8 object-contain"> 
                                    <span class="font-bold text-sm text-right">${v.title}</span>
                                </div>
                                <i class="fa fa-chevron-left text-gray-500 text-xs"></i>
                            </button>
                        `).join('')}
                    </div>
                `
            });
        };

        window.openPaddleCheckout = (itemsList) => {
            const paddleItems = itemsList.map(item => ({
                priceId: item.paddlePriceId || 'pri_01m0d1b6ktsc65fcmnghdxsmcf',
                quantity: item.qty || 1
            }));

            Paddle.Checkout.open({
                items: paddleItems,
                customer: {
                    email: auth.currentUser ? auth.currentUser.email : ""
                },
                settings: {
                    displayMode: "overlay",
                    theme: "dark",
                    locale: "ar"
                }
            });
        };

        window.showPayDetails = (k) => {
            const d = PAYMENT_DATA[k];
            const total = document.getElementById('total-price').innerText;

            if (d.isPaddle) {
                Swal.close();
                toggleCart(false);
                window.openPaddleCheckout(cart);
                return;
            }

            const paypalBtn = k === 'paypal' ? `<a href="${d.link}" target="_blank" class="block w-full bg-blue-600 text-white p-4 rounded-xl mb-4 font-bold text-center shadow-lg">اضغط هنا للدفع المباشر (PayPal)</a>` : '';
            Swal.fire({ 
                title: d.title, background:'#121212', color:'#fff', 
                confirmButtonText: 'لقد قمت بالتحويل بالفعل', 
                showCancelButton: true, cancelButtonText: 'إلغاء',
                html: `
                    ${paypalBtn}
                    <div class="p-4 bg-white/5 border border-dashed border-white/20 rounded-xl font-mono text-sm break-all mb-2 select-all">${d.value}</div>
                    ${d.name ? `<div class="text-xs text-gray-400 mb-4">باسم: ${d.name}</div>` : ''}
                    <p class="text-xs text-red-400 p-2 bg-red-500/5 rounded-lg">بعد إتمام عملية الدفع، اضغط على الزر أدناه لتأكيد طلبك وتنبيه الإدارة</p>` 
            })
            .then(r => { 
                if(r.isConfirmed) {
                    push(ref(db, "orders"), { 
                        email: auth.currentUser.email, 
                        total: total, 
                        method: k, 
                        status: 'pending', 
                        items: cart,
                        timestamp: Date.now()
                    }).then(() => {
                        window.open(`https://wa.me/905377964233?text=تم إرسال طلب جديد بقيمة ${total} عبر ${k} من الحساب: ${auth.currentUser.email}`, '_blank');
                        cart = []; 
                        updateCartUI(); 
                        toggleCart(false);
                        Swal.fire('تم إرسال طلبك', 'سيتم مراجعة الدفع وتفعيل طلبك خلال أقصر وقت ممكن', 'success');
                    });
                }
            });
        };

        // Legal Modals for Paddle Approval
        window.showLegalModal = (type) => {
            const data = {
                terms: {
                    title: 'شروط الخدمة (Terms of Service)',
                    content: `
                        <div class="text-right text-sm space-y-3 leading-relaxed text-gray-300">
                            <p><strong>1. طبيعة الخدمة:</strong> يقدم متجر YZ STORE خدمات وتصاميم رقمية مخصصة لصناع المحتوى والستريمرز (أليرتات، بكجات، تصاميم هوية البث).</p>
                            <p><strong>2. حقوق الملكية:</strong> عند إتمام الشراء، يحصل العميل على ترخيص استخدام غير حصري أو حصري حسب الباقة للمواد الرقمية المسلّمة له.</p>
                            <p><strong>3. التسليم:</strong> يتم تسليم المنتجات الرقمية فورياً أو عبر روابط تحميل مخصصة في لوحة حساب العميل بعد إتمام وتأكيد الدفع.</p>
                        </div>
                    `
                },
                refund: {
                    title: 'سياسة الاسترجاع (Refund & Cancellation)',
                    content: `
                        <div class="text-right text-sm space-y-3 leading-relaxed text-gray-300">
                            <p><strong>طبيعة المنتجات الرقمية:</strong> نظراً لأن جميع منتجاتنا وخدماتنا هي سلع رقمية وتصاميم غير ملموسة يتم تسليمها مباشرة، فإن عمليات الشراء نهائية وغير قابلة للاسترجاع بعد استلام الملفات وتحميلها.</p>
                            <p><strong>الحالات الاستثنائية:</strong> يحق للعميل طلب استرجاع المبلغ بالكامل في الحالات التالية فقط:</p>
                            <ul class="list-disc pr-5 space-y-1">
                                <li>إذا حدث خطأ تقني في الدفع وتم سحب المبلغ مكرراً.</li>
                                <li>إذا لم يتم تسليم الملفات المتفق عليها خلال 7 أيام من تاريخ الطلب.</li>
                                <li>وجود خلل فني في الملفات الرقمية لم يتمكن فريق الدعم من إصلاحه.</li>
                            </ul>
                        </div>
                    `
                },
                privacy: {
                    title: 'سياسة الخصوصية (Privacy Policy)',
                    content: `
                        <div class="text-right text-sm space-y-3 leading-relaxed text-gray-300">
                            <p>نحن نحترم خصوصية بياناتك بالكامل. لا نقوم بتخزين أو مشاركة أي بيانات بنكية أو معلومات دفع حساسة على خوادمنا.</p>
                            <p>تتم معالجة جميع المدفوعات المالية بأعلى معايير التشفير والأمان عبر بوابات دفع معتمدة عالمياً (Paddle / PayPal).</p>
                            <p>البيانات التي نجمعها (كالبريد الإلكتروني) تُستخدم فقط لغرض تسليم الطلبات وإدارة حسابك على المتجر.</p>
                        </div>
                    `
                },
                contact: {
                    title: 'اتصل بنا (Contact & Support)',
                    content: `
                        <div class="text-right text-sm space-y-3 leading-relaxed text-gray-300">
                            <p>يسعدنا تقديم الدعم الفني والإجابة على أي استفسارات تخص الطلبات:</p>
                            <p><strong>البريد الإلكتروني:</strong> osohmde@gmail.com</p>
                            <p><strong>واتساب الدعم المباشر:</strong> +90 537 796 42 33</p>
                            <p><strong>سيرفر الديسكورد:</strong> مجتمع YZ STORE الرسمي</p>
                        </div>
                    `
                }
            };

            Swal.fire({
                title: data[type].title,
                html: data[type].content,
                background: '#121212',
                color: '#fff',
                confirmButtonText: 'إغلاق',
                confirmButtonColor: '#dc2626'
            });
        };
    </script>
</body>
</html>
