<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | YZ STORE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="https://i.ibb.co/YT1RPZdx/image.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background: #070709; color: #fff; font-family: 'Cairo', sans-serif; }
        .glass-panel { background: #121218; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, select, textarea { background: #1a1a24; border: 1px solid #272732; color: white; padding: 12px 16px; border-radius: 10px; width: 100%; font-family: 'Cairo', sans-serif; transition: border 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ef4444; }
        .swal2-popup { background: #121218 !important; color: #fff !important; border-radius: 16px !important; border: 1px solid #272732 !important; }
    </style>
</head>
<body class="bg-[#070709] text-white">

    <!-- شاشة التحميل (عشان ما تطلع شاشة بيضا وقت فحص الحساب) -->
    <div id="loading-screen" class="fixed inset-0 flex items-center justify-center bg-[#070709] z-[99999]">
        <div class="flex flex-col items-center gap-4">
            <i class="fa fa-circle-notch fa-spin text-red-500 text-4xl"></i>
            <p class="text-gray-400 font-bold text-sm animate-pulse">جاري التحقق من الصلاحيات...</p>
        </div>
    </div>

    <!-- محتوى الإدارة -->
    <div id="admin-content" class="hidden opacity-0 transition-opacity duration-500">
        
        <!-- شريط التنقل للإدارة -->
        <nav class="bg-[#121218] border-b border-white/5 py-4 px-6 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/YT1RPZdx/image.png" class="h-10 w-auto">
                <span class="font-black text-xl text-white">لوحة الإدارة | <span class="text-red-500">YZ STORE</span></span>
            </div>
            <div class="flex gap-3">
                <!-- زر العودة للمتجر يعمل فوراً وبدون تعليق -->
                <button onclick="window.location.href='index.html'" class="bg-gray-800 hover:bg-gray-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2">
                    <i class="fa fa-home"></i> العودة للمتجر
                </button>
                <button onclick="window.logoutAdmin()" class="bg-red-600 hover:bg-red-500 text-white px-5 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2">
                    <i class="fa fa-sign-out-alt"></i> خروج
                </button>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">

            <!-- 1. تعديل وصف المتجر -->
            <div class="glass-panel">
                <h2 class="text-xl font-black text-white mb-4"><i class="fa fa-pen text-red-500"></i> تعديل وصف المتجر (الرئيسية)</h2>
                <textarea id="store-desc-input" rows="3" placeholder="اكتب الوصف هنا..."></textarea>
                <button onclick="window.saveStoreDesc()" class="mt-4 bg-red-600 hover:bg-red-500 text-white px-8 py-2.5 rounded-xl font-bold transition shadow-lg shadow-red-600/30">حفظ الوصف</button>
            </div>

            <!-- 2. إدارة لوحة الشرف (المربعات الثلاثة الأساسية) -->
            <div class="glass-panel border-yellow-500/30 border">
                <h2 class="text-xl font-black text-yellow-400 mb-6 flex items-center gap-2">
                    <i class="fa fa-trophy"></i> إدارة لوحة الشرف (Top 3)
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- المركز الأول -->
                    <div class="bg-[#1a1a24] p-5 rounded-xl border border-yellow-500">
                        <h3 class="text-yellow-500 font-bold mb-4 text-center">المركز الأول 🥇</h3>
                        <div class="space-y-3">
                            <input id="vip-name-1" type="text" placeholder="اسم الستريمر">
                            <input id="vip-role-1" type="text" placeholder="اللقب (مثل: أكبر داعم)">
                            <input id="vip-img-1" type="text" placeholder="رابط صورة الستريمر">
                            <input id="vip-link-1" type="text" placeholder="رابط القناة">
                            <button onclick="window.saveVIP(1)" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white py-2 rounded-lg font-bold transition mt-2">حفظ المركز الأول</button>
                        </div>
                    </div>
                    <!-- المركز الثاني -->
                    <div class="bg-[#1a1a24] p-5 rounded-xl border border-gray-400">
                        <h3 class="text-gray-400 font-bold mb-4 text-center">المركز الثاني 🥈</h3>
                        <div class="space-y-3">
                            <input id="vip-name-2" type="text" placeholder="اسم الستريمر">
                            <input id="vip-role-2" type="text" placeholder="اللقب">
                            <input id="vip-img-2" type="text" placeholder="رابط صورة الستريمر">
                            <input id="vip-link-2" type="text" placeholder="رابط القناة">
                            <button onclick="window.saveVIP(2)" class="w-full bg-gray-500 hover:bg-gray-400 text-white py-2 rounded-lg font-bold transition mt-2">حفظ المركز الثاني</button>
                        </div>
                    </div>
                    <!-- المركز الثالث -->
                    <div class="bg-[#1a1a24] p-5 rounded-xl border border-amber-700">
                        <h3 class="text-amber-600 font-bold mb-4 text-center">المركز الثالث 🥉</h3>
                        <div class="space-y-3">
                            <input id="vip-name-3" type="text" placeholder="اسم الستريمر">
                            <input id="vip-role-3" type="text" placeholder="اللقب">
                            <input id="vip-img-3" type="text" placeholder="رابط صورة الستريمر">
                            <input id="vip-link-3" type="text" placeholder="رابط القناة">
                            <button onclick="window.saveVIP(3)" class="w-full bg-amber-700 hover:bg-amber-600 text-white py-2 rounded-lg font-bold transition mt-2">حفظ المركز الثالث</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. إدارة أكواد الخصم -->
            <div class="glass-panel border-green-500/20 border">
                <h2 class="text-xl font-black text-white mb-6"><i class="fa fa-ticket text-green-500"></i> إدارة أكواد الخصم</h2>
                <div class="flex flex-col md:flex-row gap-4 mb-6">
                    <input id="d-code" type="text" placeholder="كود الخصم (مثال: YZ10)" class="uppercase">
                    <input id="d-desc" type="text" placeholder="ملاحظة (مثال: خصم العيد)">
                    <button onclick="window.addDiscount()" class="bg-green-600 hover:bg-green-500 text-white px-8 py-3 rounded-xl font-black transition whitespace-nowrap">إضافة الكود</button>
                </div>
                <div id="admin-discounts-list" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <!-- ستظهر أكواد الخصم هنا -->
                </div>
            </div>

            <!-- 4. إضافة منتج جديد -->
            <div class="glass-panel">
                <h2 class="text-xl font-black text-white mb-6"><i class="fa fa-plus text-blue-500"></i> إضافة منتج جديد</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <input id="p-title" type="text" placeholder="اسم المنتج">
                    <input id="p-price" type="number" placeholder="السعر (بالدولار)">
                    <input id="p-image" type="text" placeholder="رابط صورة المنتج (ImgBB)">
                    <input id="p-paddle" type="text" placeholder="معرف السعر من Paddle (Price ID)">
                    <input id="p-youtube" type="text" placeholder="رابط يوتيوب للمعاينة (اختياري)">
                    <select id="p-cat">
                        <option value="alerts">الأليرتات والتصاميم</option>
                        <option value="packages">البكجات والاشتراكات</option>
                    </select>
                </div>
                <button onclick="window.addProduct()" class="mt-6 bg-blue-600 hover:bg-blue-500 text-white px-10 py-3 rounded-xl font-black transition">إضافة المنتج</button>
            </div>

            <!-- 5. المنتجات الحالية -->
            <div class="glass-panel">
                <h2 class="text-xl font-black text-white mb-6"><i class="fa fa-box text-blue-500"></i> المنتجات الحالية</h2>
                <div id="admin-products-list" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
            </div>

        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCt5H1t5dqUxileT88DqkIT5WRSGx45Lps",
            authDomain: "osman-70f42.firebaseapp.com",
            databaseURL: "https://osman-70f42-default-rtdb.firebaseio.com",
            projectId: "osman-70f42",
            storageBucket: "osman-70f42.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const ADMIN_EMAIL = "osohmde@gmail.com";

        // التحقق من الصلاحيات وإظهار اللوحة
        onAuthStateChanged(auth, user => {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) loadingScreen.remove();

            if (user && user.email === ADMIN_EMAIL) {
                const adminContent = document.getElementById('admin-content');
                adminContent.classList.remove('hidden');
                setTimeout(() => adminContent.classList.remove('opacity-0'), 50);
            } else {
                Swal.fire({ title: 'غير مصرح!', text: 'يجب تسجيل الدخول بحساب الإدارة.', icon: 'error', confirmButtonText: 'العودة للمتجر', allowOutsideClick: false }).then(() => { window.location.href = 'index.html'; });
            }
        });

        window.logoutAdmin = () => { signOut(auth).then(() => { window.location.href = 'index.html'; }); };

        // وصف المتجر
        onValue(ref(db, "store_settings/desc"), snapshot => { document.getElementById('store-desc-input').value = snapshot.val() || ""; });
        window.saveStoreDesc = () => { set(ref(db, "store_settings/desc"), document.getElementById('store-desc-input').value).then(() => { Swal.fire('نجاح', 'تم تحديث الوصف', 'success'); }); };

        // لوحة الشرف
        onValue(ref(db, "store_settings/leaderboard"), snapshot => {
            const data = snapshot.val() || {};
            if(data.rank1) { document.getElementById('vip-name-1').value = data.rank1.name || ''; document.getElementById('vip-role-1').value = data.rank1.role || ''; document.getElementById('vip-img-1').value = data.rank1.img || ''; document.getElementById('vip-link-1').value = data.rank1.link || ''; }
            if(data.rank2) { document.getElementById('vip-name-2').value = data.rank2.name || ''; document.getElementById('vip-role-2').value = data.rank2.role || ''; document.getElementById('vip-img-2').value = data.rank2.img || ''; document.getElementById('vip-link-2').value = data.rank2.link || ''; }
            if(data.rank3) { document.getElementById('vip-name-3').value = data.rank3.name || ''; document.getElementById('vip-role-3').value = data.rank3.role || ''; document.getElementById('vip-img-3').value = data.rank3.img || ''; document.getElementById('vip-link-3').value = data.rank3.link || ''; }
        });

        window.saveVIP = (rank) => {
            const name = document.getElementById(`vip-name-${rank}`).value;
            const role = document.getElementById(`vip-role-${rank}`).value;
            const img = document.getElementById(`vip-img-${rank}`).value;
            const link = document.getElementById(`vip-link-${rank}`).value;
            set(ref(db, `store_settings/leaderboard/rank${rank}`), { name, role, img, link }).then(() => { Swal.fire('تم الحفظ', `تم تحديث المركز ${rank}`, 'success'); });
        };

        // أكواد الخصم
        window.addDiscount = () => {
            const code = document.getElementById('d-code').value.trim().toUpperCase(); const desc = document.getElementById('d-desc').value.trim();
            if(!code) return Swal.fire('تنبيه', 'يرجى كتابة كود الخصم', 'warning');
            push(ref(db, "discount_codes"), { code, desc }).then(() => { Swal.fire('نجاح', 'تم إضافة الكود', 'success'); document.getElementById('d-code').value = ''; document.getElementById('d-desc').value = ''; });
        };

        onValue(ref(db, "discount_codes"), snapshot => {
            const list = document.getElementById('admin-discounts-list'); list.innerHTML = "";
            snapshot.forEach(child => {
                const d = child.val();
                list.innerHTML += `<div class="bg-[#1a1a24] border border-green-500/20 p-4 rounded-xl flex justify-between items-center"><div><p class="font-black text-green-400 text-lg">${d.code}</p><p class="text-xs text-gray-400 mt-1">${d.desc || 'بدون ملاحظة'}</p></div><button onclick="window.deleteDiscount('${child.key}')" class="bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white w-8 h-8 rounded-lg flex items-center justify-center transition"><i class="fa fa-trash"></i></button></div>`;
            });
        });

        window.deleteDiscount = (key) => { Swal.fire({ title: 'حذف الكود؟', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#272732', confirmButtonText: 'نعم', cancelButtonText: 'إلغاء' }).then((result) => { if (result.isConfirmed) { remove(ref(db, `discount_codes/${key}`)); } }); };

        // المنتجات
        window.addProduct = () => {
            const title = document.getElementById('p-title').value; const price = document.getElementById('p-price').value; const image = document.getElementById('p-image').value; const paddlePriceId = document.getElementById('p-paddle').value; const youtube = document.getElementById('p-youtube').value; const category = document.getElementById('p-cat').value;
            if(!title || !price || !image || !paddlePriceId) return Swal.fire('تنبيه', 'يرجى تعبئة الحقول الأساسية', 'warning');
            push(ref(db, "products"), { title, price, image, paddlePriceId, youtube, category }).then(() => { Swal.fire('نجاح', 'تم الإضافة', 'success'); document.getElementById('p-title').value = ''; document.getElementById('p-price').value = ''; document.getElementById('p-image').value = ''; document.getElementById('p-paddle').value = ''; document.getElementById('p-youtube').value = ''; });
        };

        onValue(ref(db, "products"), snapshot => {
            const list = document.getElementById('admin-products-list'); list.innerHTML = "";
            snapshot.forEach(child => {
                const p = child.val();
                list.innerHTML += `<div class="bg-[#1a1a24] border border-white/5 p-4 rounded-xl flex justify-between items-center"><div class="flex items-center gap-4"><img src="${p.image}" class="w-14 h-14 rounded-lg object-cover"><div><p class="font-bold text-sm text-white">${p.title}</p><p class="text-red-500 text-xs font-black mt-1">$${p.price}</p></div></div><button onclick="window.deleteProduct('${child.key}')" class="bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white w-10 h-10 rounded-xl flex items-center justify-center transition"><i class="fa fa-trash"></i></button></div>`;
            });
        });

        window.deleteProduct = (key) => { Swal.fire({ title: 'تأكيد الحذف؟', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#272732', confirmButtonText: 'نعم', cancelButtonText: 'إلغاء' }).then((result) => { if (result.isConfirmed) { remove(ref(db, `products/${key}`)); } }); };
    </script>
</body>
</html>
