<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | YZ STORE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="https://i.ibb.co/YT1RPZdx/image.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background: #070709; color: #fff; font-family: 'Cairo', sans-serif; }
        .glass-panel { background: #121218; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 24px; }
        input, select, textarea { background: #1a1a24; border: 1px solid #272732; color: white; padding: 10px 14px; border-radius: 8px; width: 100%; font-family: 'Cairo', sans-serif; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ef4444; }
        .swal2-popup { background: #121218 !important; color: #fff !important; border-radius: 16px !important; border: 1px solid #272732 !important; }
        .swal2-title { font-family: 'Cairo', sans-serif !important; }
    </style>
</head>
<body class="hidden" id="admin-body">

    <!-- شريط التنقل للإدارة -->
    <nav class="bg-[#121218] border-b border-white/5 py-4 px-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/YT1RPZdx/image.png" class="h-10 w-auto">
            <span class="font-black text-xl text-white">لوحة الإدارة | <span class="text-red-500">YZ STORE</span></span>
        </div>
        <div class="flex gap-3">
            <!-- تم إصلاح زر العودة للمتجر ليعمل بنسبة 100% -->
            <button onclick="window.location.href='index.html'" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition"><i class="fa fa-home"></i> العودة للمتجر</button>
            <button onclick="window.logoutAdmin()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg font-bold text-sm transition"><i class="fa fa-sign-out-alt"></i> تسجيل الخروج</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">

        <!-- 1. إدارة وصف المتجر -->
        <div class="glass-panel">
            <h2 class="text-xl font-black text-white mb-4"><i class="fa fa-pen text-red-500"></i> تعديل وصف المتجر (الرئيسية)</h2>
            <textarea id="store-desc-input" rows="3" placeholder="اكتب الوصف هنا..."></textarea>
            <button onclick="window.saveStoreDesc()" class="mt-4 bg-red-600 hover:bg-red-500 text-white px-6 py-2 rounded-lg font-bold transition">حفظ الوصف</button>
        </div>

        <!-- 2. إدارة لوحة الشرف (تم تحويلها لزر ذكي ومختصر لتوفير المساحة) -->
        <div class="glass-panel border-yellow-500/30 border flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-xl font-black text-yellow-400 mb-1 flex items-center gap-2">
                    <i class="fa fa-trophy"></i> إدارة لوحة الشرف (Top 3)
                </h2>
                <p class="text-sm text-gray-400">تحكم بأسماء وصور الستريمرز في الصفحة الرئيسية بخطوة واحدة.</p>
            </div>
            <button onclick="window.manageVIP()" class="bg-yellow-600 hover:bg-yellow-500 text-white px-8 py-3 rounded-xl font-black transition flex items-center gap-2 shadow-lg shadow-yellow-600/20">
                <i class="fa fa-pen"></i> إدارة لوحة الشرف
            </button>
        </div>

        <!-- 3. إضافة منتج جديد -->
        <div class="glass-panel">
            <h2 class="text-xl font-black text-white mb-4"><i class="fa fa-plus text-green-500"></i> إضافة منتج جديد</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="p-title" type="text" placeholder="اسم المنتج">
                <input id="p-price" type="number" placeholder="السعر (بالدولار)">
                <input id="p-image" type="text" placeholder="رابط صورة المنتج (ImgBB)">
                <input id="p-paddle" type="text" placeholder="معرف السعر من Paddle (Price ID)">
                <input id="p-youtube" type="text" placeholder="رابط يوتيوب للمعاينة (اختياري)">
                <select id="p-cat">
                    <option value="alerts">الأليرتات والتصاميم</option>
                    <option value="packages">البكجات والاشتراكات</option>
                </select>
            </div>
            <button onclick="window.addProduct()" class="mt-4 bg-green-600 hover:bg-green-500 text-white px-8 py-2 rounded-lg font-bold transition">إضافة المنتج</button>
        </div>

        <!-- 4. قائمة المنتجات الحالية -->
        <div class="glass-panel">
            <h2 class="text-xl font-black text-white mb-4"><i class="fa fa-box text-blue-500"></i> المنتجات الحالية</h2>
            <div id="admin-products-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- سيتم عرض المنتجات هنا برمجياً -->
            </div>
        </div>

    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        // تم إضافة دالة "get" لاسترجاع بيانات لوحة الشرف
        import { getDatabase, ref, set, push, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCt5H1t5dqUxileT88DqkIT5WRSGx45Lps",
            authDomain: "osman-70f42.firebaseapp.com",
            databaseURL: "https://osman-70f42-default-rtdb.firebaseio.com",
            projectId: "osman-70f42",
            storageBucket: "osman-70f42.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const ADMIN_EMAIL = "osohmde@gmail.com";

        // حماية صفحة الإدارة
        onAuthStateChanged(auth, user => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('admin-body').classList.remove('hidden');
            } else {
                Swal.fire({
                    title: 'غير مصرح!',
                    text: 'ليس لديك صلاحية لدخول لوحة التحكم',
                    icon: 'error',
                    confirmButtonText: 'العودة للمتجر',
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = 'index.html';
                });
            }
        });

        window.logoutAdmin = () => {
            signOut(auth).then(() => {
                window.location.href = 'index.html';
            });
        };

        // --- نظام وصف المتجر ---
        onValue(ref(db, "store_settings/desc"), snapshot => {
            document.getElementById('store-desc-input').value = snapshot.val() || "";
        });
        window.saveStoreDesc = () => {
            const desc = document.getElementById('store-desc-input').value;
            set(ref(db, "store_settings/desc"), desc).then(() => {
                Swal.fire('نجاح', 'تم تحديث وصف المتجر', 'success');
            });
        };

        // --- نظام لوحة الشرف (VIP Leaderboard) المطور ---
        window.manageVIP = async () => {
            // أولاً: اختيار المركز
            const { value: rank } = await Swal.fire({
                title: 'إدارة لوحة الشرف 🏆',
                text: 'اختر المركز الذي تريد تعديله:',
                input: 'select',
                inputOptions: {
                    '1': 'المركز الأول 🥇',
                    '2': 'المركز الثاني 🥈',
                    '3': 'المركز الثالث 🥉'
                },
                inputPlaceholder: 'اختر المركز',
                showCancelButton: true,
                confirmButtonText: 'التالي &larr;',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#eab308'
            });

            if (rank) {
                Swal.showLoading();
                // جلب البيانات الحالية للمركز المختار لتسهيل التعديل
                const snapshot = await get(ref(db, `store_settings/leaderboard/rank${rank}`));
                const data = snapshot.val() || { name: '', role: '', img: '', link: '' };
                Swal.close();

                // ثانياً: تعديل البيانات
                const { value: formValues } = await Swal.fire({
                    title: `تعديل المركز ${rank}`,
                    html: `
                        <input id="vip-name" class="swal2-input" placeholder="اسم الستريمر" value="${data.name}" style="width: 85%; margin: 8px auto;">
                        <input id="vip-role" class="swal2-input" placeholder="اللقب (مثل: أكبر داعم)" value="${data.role}" style="width: 85%; margin: 8px auto;">
                        <input id="vip-img" class="swal2-input" placeholder="رابط الصورة (ImgBB)" value="${data.img}" style="width: 85%; margin: 8px auto;">
                        <input id="vip-link" class="swal2-input" placeholder="رابط القناة (يوتيوب/تويتش)" value="${data.link}" style="width: 85%; margin: 8px auto;">
                    `,
                    focusConfirm: false,
                    showCancelButton: true,
                    confirmButtonText: 'حفظ التعديلات',
                    cancelButtonText: 'إلغاء',
                    confirmButtonColor: '#16a34a',
                    preConfirm: () => {
                        return {
                            name: document.getElementById('vip-name').value,
                            role: document.getElementById('vip-role').value,
                            img: document.getElementById('vip-img').value,
                            link: document.getElementById('vip-link').value
                        }
                    }
                });

                if (formValues) {
                    set(ref(db, `store_settings/leaderboard/rank${rank}`), formValues).then(() => {
                        Swal.fire({
                            title: 'تم الحفظ!',
                            text: \`تم تحديث المركز \${rank} بنجاح\`,
                            icon: 'success',
                            confirmButtonColor: '#16a34a'
                        });
                    });
                }
            }
        };

        // --- نظام المنتجات ---
        window.addProduct = () => {
            const title = document.getElementById('p-title').value;
            const price = document.getElementById('p-price').value;
            const image = document.getElementById('p-image').value;
            const paddlePriceId = document.getElementById('p-paddle').value;
            const youtube = document.getElementById('p-youtube').value;
            const category = document.getElementById('p-cat').value;

            if(!title || !price || !image || !paddlePriceId) {
                return Swal.fire('تنبيه', 'يرجى تعبئة جميع الحقول الأساسية', 'warning');
            }

            push(ref(db, "products"), {
                title, price, image, paddlePriceId, youtube, category
            }).then(() => {
                Swal.fire('نجاح', 'تم إضافة المنتج بنجاح', 'success');
                document.getElementById('p-title').value = '';
                document.getElementById('p-price').value = '';
                document.getElementById('p-image').value = '';
                document.getElementById('p-paddle').value = '';
                document.getElementById('p-youtube').value = '';
            });
        };

        onValue(ref(db, "products"), snapshot => {
            const list = document.getElementById('admin-products-list');
            list.innerHTML = "";
            snapshot.forEach(child => {
                const p = child.val();
                list.innerHTML += `
                <div class="bg-[#1a1a24] border border-white/5 p-4 rounded-xl flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <img src="${p.image}" class="w-12 h-12 rounded object-cover">
                        <div>
                            <p class="font-bold text-sm text-white">${p.title}</p>
                            <p class="text-red-500 text-xs font-black">$${p.price}</p>
                        </div>
                    </div>
                    <button onclick="window.deleteProduct('${child.key}')" class="bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white w-8 h-8 rounded-lg flex items-center justify-center transition">
                        <i class="fa fa-trash"></i>
                    </button>
                </div>`;
            });
        });

        window.deleteProduct = (key) => {
            Swal.fire({
                title: 'هل أنت متأكد؟',
                text: "لن تتمكن من التراجع عن حذف هذا المنتج!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#272732',
                confirmButtonText: 'نعم، احذفه!',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    remove(ref(db, `products/${key}`)).then(() => {
                        Swal.fire('تم الحذف!', 'تم مسح المنتج من المتجر.', 'success');
                    });
                }
            });
        };
    </script>
</body>
</html>
