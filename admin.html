<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | YZ STORE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="https://i.ibb.co/YT1RPZdx/image.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background: #070709; color: #fff; font-family: 'Cairo', sans-serif; }
        .glass-panel { background: #121218; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, select, textarea { background: #1a1a24; border: 1px solid #272732; color: white; padding: 12px 16px; border-radius: 10px; width: 100%; font-family: 'Cairo', sans-serif; transition: border 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ef4444; }
    </style>
</head>
<body class="bg-[#070709] text-white">

    <!-- شريط التنقل للإدارة -->
    <nav class="bg-[#121218] border-b border-white/5 py-4 px-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/YT1RPZdx/image.png" class="h-10 w-auto">
            <span class="font-black text-xl text-white">لوحة الإدارة | <span class="text-red-500">YZ STORE</span></span>
        </div>
        <div class="flex gap-3">
            <!-- زر العودة للمتجر يعمل فوراً -->
            <button onclick="window.location.href='index.html'" class="bg-gray-800 hover:bg-gray-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2">
                <i class="fa fa-home"></i> العودة للمتجر
            </button>
            <button onclick="window.logoutAdmin()" class="bg-red-600 hover:bg-red-500 text-white px-5 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2">
                <i class="fa fa-sign-out-alt"></i> خروج
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">

        <!-- 1. تعديل وصف المتجر -->
        <div class="glass-panel">
            <h2 class="text-xl font-black text-white mb-4"><i class="fa fa-pen text-red-500"></i> تعديل وصف المتجر (الرئيسية)</h2>
            <textarea id="store-desc-input" rows="3" placeholder="اكتب الوصف هنا..."></textarea>
            <button onclick="window.saveStoreDesc()" class="mt-4 bg-red-600 hover:bg-red-500 text-white px-8 py-2.5 rounded-xl font-bold transition">حفظ الوصف</button>
        </div>

        <!-- 2. إدارة أكواد الخصم -->
        <div class="glass-panel border-green-500/20 border">
            <h2 class="text-xl font-black text-white mb-6"><i class="fa fa-ticket text-green-500"></i> إدارة أكواد الخصم</h2>
            
            <div class="flex flex-col md:flex-row gap-4 mb-6">
                <input id="d-code" type="text" placeholder="كود الخصم (مثال: YZ10)" class="uppercase">
                <input id="d-desc" type="text" placeholder="ملاحظة (مثال: خصم 10% بمناسبة العيد)">
                <button onclick="window.addDiscount()" class="bg-green-600 hover:bg-green-500 text-white px-8 py-3 rounded-xl font-black transition whitespace-nowrap">إضافة الكود</button>
            </div>

            <div id="admin-discounts-list" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- ستظهر أكواد الخصم هنا -->
            </div>
            <p class="text-xs text-gray-500 mt-4">* ملاحظة: يجب أن تكون أكواد الخصم مُفعلة أيضاً من لوحة تحكم Paddle لكي تعمل عند الدفع.</p>
        </div>

        <!-- 3. إضافة منتج جديد -->
        <div class="glass-panel">
            <h2 class="text-xl font-black text-white mb-6"><i class="fa fa-plus text-blue-500"></i> إضافة منتج جديد</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <input id="p-title" type="text" placeholder="اسم المنتج">
                <input id="p-price" type="number" placeholder="السعر (بالدولار)">
                <input id="p-image" type="text" placeholder="رابط صورة المنتج (ImgBB)">
                <input id="p-paddle" type="text" placeholder="معرف السعر من Paddle (Price ID)">
                <input id="p-youtube" type="text" placeholder="رابط يوتيوب للمعاينة (اختياري)">
                <select id="p-cat">
                    <option value="alerts">الأليرتات والتصاميم</option>
                    <option value="packages">البكجات والاشتراكات</option>
                </select>
            </div>
            <button onclick="window.addProduct()" class="mt-6 bg-blue-600 hover:bg-blue-500 text-white px-10 py-3 rounded-xl font-black transition">إضافة المنتج</button>
        </div>

        <!-- 4. المنتجات الحالية -->
        <div class="glass-panel">
            <h2 class="text-xl font-black text-white mb-6"><i class="fa fa-box text-blue-500"></i> المنتجات الحالية</h2>
            <div id="admin-products-list" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
        </div>

    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCt5H1t5dqUxileT88DqkIT5WRSGx45Lps",
            authDomain: "osman-70f42.firebaseapp.com",
            databaseURL: "https://osman-70f42-default-rtdb.firebaseio.com",
            projectId: "osman-70f42",
            storageBucket: "osman-70f42.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const ADMIN_EMAIL = "osohmde@gmail.com";

        onAuthStateChanged(auth, user => {
            if (!user || user.email !== ADMIN_EMAIL) {
                Swal.fire({ title: 'غير مصرح!', text: 'يجب تسجيل الدخول بحساب الإدارة.', icon: 'error', confirmButtonText: 'العودة للمتجر', allowOutsideClick: false }).then(() => { window.location.href = 'index.html'; });
            }
        });

        window.logoutAdmin = () => { signOut(auth).then(() => { window.location.href = 'index.html'; }); };

        // وصف المتجر
        onValue(ref(db, "store_settings/desc"), snapshot => { document.getElementById('store-desc-input').value = snapshot.val() || ""; });
        window.saveStoreDesc = () => { set(ref(db, "store_settings/desc"), document.getElementById('store-desc-input').value).then(() => { Swal.fire('نجاح', 'تم تحديث الوصف', 'success'); }); };

        // أكواد الخصم
        window.addDiscount = () => {
            const code = document.getElementById('d-code').value.trim().toUpperCase();
            const desc = document.getElementById('d-desc').value.trim();
            if(!code) return Swal.fire('تنبيه', 'يرجى كتابة كود الخصم', 'warning');
            
            push(ref(db, "discount_codes"), { code, desc }).then(() => {
                Swal.fire('نجاح', 'تم إضافة كود الخصم', 'success');
                document.getElementById('d-code').value = '';
                document.getElementById('d-desc').value = '';
            });
        };

        onValue(ref(db, "discount_codes"), snapshot => {
            const list = document.getElementById('admin-discounts-list');
            list.innerHTML = "";
            snapshot.forEach(child => {
                const d = child.val();
                list.innerHTML += `
                <div class="bg-[#1a1a24] border border-green-500/20 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <p class="font-black text-green-400 text-lg">${d.code}</p>
                        <p class="text-xs text-gray-400 mt-1">${d.desc || 'بدون ملاحظة'}</p>
                    </div>
                    <button onclick="window.deleteDiscount('${child.key}')" class="bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white w-8 h-8 rounded-lg flex items-center justify-center transition">
                        <i class="fa fa-trash"></i>
                    </button>
                </div>`;
            });
        });

        window.deleteDiscount = (key) => {
            Swal.fire({ title: 'حذف الكود؟', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#272732', confirmButtonText: 'نعم، احذف', cancelButtonText: 'إلغاء' }).then((result) => {
                if (result.isConfirmed) { remove(ref(db, `discount_codes/${key}`)); }
            });
        };

        // المنتجات
        window.addProduct = () => {
            const title = document.getElementById('p-title').value; const price = document.getElementById('p-price').value; const image = document.getElementById('p-image').value; const paddlePriceId = document.getElementById('p-paddle').value; const youtube = document.getElementById('p-youtube').value; const category = document.getElementById('p-cat').value;
            if(!title || !price || !image || !paddlePriceId) return Swal.fire('تنبيه', 'يرجى تعبئة الحقول الأساسية', 'warning');
            push(ref(db, "products"), { title, price, image, paddlePriceId, youtube, category }).then(() => { Swal.fire('نجاح', 'تم الإضافة', 'success'); document.getElementById('p-title').value = ''; document.getElementById('p-price').value = ''; document.getElementById('p-image').value = ''; document.getElementById('p-paddle').value = ''; document.getElementById('p-youtube').value = ''; });
        };

        onValue(ref(db, "products"), snapshot => {
            const list = document.getElementById('admin-products-list'); list.innerHTML = "";
            snapshot.forEach(child => {
                const p = child.val();
                list.innerHTML += `<div class="bg-[#1a1a24] border border-white/5 p-4 rounded-xl flex justify-between items-center"><div class="flex items-center gap-4"><img src="${p.image}" class="w-14 h-14 rounded-lg object-cover"><div><p class="font-bold text-sm text-white">${p.title}</p><p class="text-red-500 text-xs font-black mt-1">$${p.price}</p></div></div><button onclick="window.deleteProduct('${child.key}')" class="bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white w-10 h-10 rounded-xl flex items-center justify-center transition"><i class="fa fa-trash"></i></button></div>`;
            });
        });

        window.deleteProduct = (key) => { Swal.fire({ title: 'تأكيد الحذف؟', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#272732', confirmButtonText: 'نعم، احذف', cancelButtonText: 'إلغاء' }).then((result) => { if (result.isConfirmed) { remove(ref(db, `products/${key}`)); } }); };
    </script>
</body>
</html>
